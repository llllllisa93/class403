<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班級聯絡簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FBF3DC;
    --paper-dark: #F2E4B8;
    --border-brown: #6B4A2B;
    --gold: #E8C468;
    --gold-dark: #D9A93D;
    --red: #C0392B;
    --ink: #3A2E22;
    --ink-soft: #7A6A50;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: #EDE6D3;
    color: var(--ink);
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    min-height:100vh;
    padding: 0 0 50px;
  }
  header{
    text-align:center;
    padding: 26px 20px 18px;
  }
  header h1{
    margin:0; font-size: 24px; color: var(--ink);
    font-family:"Kalam",sans-serif; font-weight:700; letter-spacing:1px;
  }
  main{ max-width: 640px; margin: 0 auto; padding: 0 18px; }

  .card{
    background: var(--paper);
    border: 4px solid var(--border-brown);
    border-radius: 22px;
    overflow:hidden;
    box-shadow: 0 14px 30px rgba(0,0,0,0.18);
  }
  .card-title{
    background: var(--paper-dark);
    border-bottom: 3px solid var(--border-brown);
    padding: 16px 20px;
    font-size: 17px; font-weight:700; text-align:center;
  }
  .card-body{ padding: 20px; }

  .top-row{ display:flex; gap:16px; margin-bottom: 18px; }
  .date-block{
    flex: 0 0 108px;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dark) 100%);
    border-radius: 14px;
    border: 2px solid var(--border-brown);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .date-cell{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-bottom: 1px solid rgba(107,74,43,0.35);
    padding: 8px 4px;
  }
  .date-cell:last-child{ border-bottom:none; }
  .date-cell .num{
    font-family:"Kalam",sans-serif; font-weight:700; font-size: 26px; color: var(--red);
    line-height:1;
  }
  .date-cell .unit{ font-size: 12px; color: var(--ink-soft); margin-top:2px; }
  .date-cell.weekday .num{ font-size: 20px; }

  .top-info{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .top-info .greeting{ font-size:15px; color: var(--ink-soft); margin-bottom:4px; }
  .top-info .classname{ font-family:"Kalam",sans-serif; font-size:20px; font-weight:700; }

  .section{ margin-bottom: 16px; }
  .section-label{
    display:flex; align-items:center; gap:8px;
    font-weight:700; font-size:14.5px; margin-bottom:8px;
  }
  ul.item-list{ list-style:none; margin:0; padding:0; }
  ul.item-list li{
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(107,74,43,0.15);
    border-radius: 9px;
    padding: 9px 13px;
    margin-bottom: 7px;
    font-size: 14.5px; line-height:1.5;
  }

  .divider{
    border: none; border-top: 2px dashed rgba(107,74,43,0.35);
    margin: 4px 0 16px;
  }

  .teacher-note{
    background: rgba(192,57,43,0.08);
    border-left: 4px solid var(--red);
    border-radius: 8px;
    padding: 13px 15px;
    font-size: 14px; line-height:1.6;
  }
  .teacher-note b{ color: var(--red); }

  footer{
    max-width:640px; margin: 18px auto 0; padding: 0 18px;
    color: var(--ink-soft); font-size:12px; text-align:center;
  }
</style>
</head>
<body>

<header>
  <!-- ===== 改這裡：標題 ===== -->
  <h1>📋 三年級電子聯絡本</h1>
  <!-- ===== 標題結束 ===== -->
</header>

<main>
  <div class="card">
    <div class="card-title">今天的聯絡事項與功課</div>
    <div class="card-body">

      <div class="top-row">
        <div class="date-block">
          <div class="date-cell"><span class="num" id="rocYear">115</span><span class="unit">年</span></div>
          <div class="date-cell"><span class="num" id="month">8</span><span class="unit">月</span></div>
          <div class="date-cell"><span class="num" id="day">26</span><span class="unit">日</span></div>
          <div class="date-cell weekday"><span class="num" id="weekday">三</span><span class="unit">星期</span></div>
        </div>
        <div class="top-info">
          <div class="greeting">親愛的家長，您好：</div>
          <!-- ===== 改這裡：班級名稱 ===== -->
          <div class="classname">三年二班</div>
          <!-- ===== 班級名稱結束 ===== -->
        </div>
      </div>

      <div class="section">
        <div class="section-label">📌 聯絡事項</div>
        <!-- ===== 改這裡：聯絡事項，每一項用 <li>文字</li> 表示，要新增就複製一行 ===== -->
        <ul class="item-list">
          <li>今天發回月考考卷，請家長簽名。</li>
          <li>下週二戶外教學，請攜帶悠遊卡。</li>
        </ul>
        <!-- ===== 聯絡事項結束 ===== -->
      </div>

      <div class="section">
        <div class="section-label">✏️ 回家作業</div>
